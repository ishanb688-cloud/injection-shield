<h1>Monsoon Gardening Tips</h1>
<p>The monsoon is a great time to plant leafy vegetables. Make sure your pots drain well,
because standing water rots roots quickly.</p>
<p>Add compost every few weeks and watch for fungus on the leaves.</p>

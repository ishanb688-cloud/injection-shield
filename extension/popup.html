<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Injection Shield</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;width:380px;padding:18px;color:#e8ecf4;font:14px/1.5 "Segoe UI Variable Display","SF Pro Display","Segoe UI",system-ui,sans-serif;
    background:radial-gradient(120% 70% at 0% 0%,rgba(99,102,241,.28),transparent 60%),#07090e}
  header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  header img{width:44px;height:44px;flex:none}
  h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
  .sub{margin:2px 0 0;color:#8a94a7;font-size:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{font:600 13px inherit;color:#e8ecf4;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    border-radius:999px;padding:10px 18px;cursor:pointer;transition:transform .15s ease,background .2s ease}
  button:hover{background:rgba(255,255,255,.11)}
  button:active{transform:scale(.97)}
  button.primary{color:#05070b;border:0;background:linear-gradient(135deg,#8b9bff,#3fd8ea);box-shadow:0 8px 22px rgba(99,102,241,.4)}
  #out{margin-top:14px}
  .badge{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:700}
  .bad{background:rgba(255,125,110,.14);color:#ff7d6e}
  .good{background:rgba(79,227,161,.12);color:#4fe3a1}
  .item{margin:8px 0;padding:10px 12px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.03);font-size:12px}
  .item b{display:block;margin-bottom:2px;color:#ffb3a9}
  .item q{display:block;color:#8a94a7;quotes:none;word-break:break-word}
  .note{color:#8a94a7;font-size:12px;margin:8px 0}
  footer{margin-top:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);color:#6b7589;font-size:11px}
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div>
      <h1>Injection Shield</h1>
      <p class="sub">Scans this page on your device. Nothing is sent anywhere.</p>
    </div>
  </header>
  <div class="row">
    <button class="primary" id="scan">Scan this page</button>
    <button id="remove" hidden>Remove hidden text</button>
  </div>
  <div id="out"></div>
  <footer>v0.2.0 &middot; experimental &middot; pattern-based, so rewording can slip past it</footer>
  <script src="popup.js"></script>
</body>
</html>
